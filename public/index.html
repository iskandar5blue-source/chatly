<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chatly</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2337b6ff'/%3E%3Cstop offset='1' stop-color='%237b4dff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L16 61V50h-2A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z' fill='url(%23g)'/%3E%3Cpath d='M14 4h36a10 10 0 0 1 10 10v6C46 28 22 24 4 18v-4A10 10 0 0 1 14 4z' fill='%23fff' fill-opacity='.18'/%3E%3Ctext x='32' y='39' font-size='30' font-weight='800' text-anchor='middle' fill='%23fff' font-family='Arial,Helvetica,sans-serif'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0e1621;--p:#17212b;--p2:#202b36;--ac:#2b95e6;--t:#e8eef4;--m:#7f91a4;--mine:#2b5278;--line:#0b121a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100dvh;font:14px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--t)}
button,input{font:inherit;color:inherit}
button{background:var(--p2);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button:hover{background:#2a3948}
input:not([type=checkbox]){background:var(--p2);border:1px solid #2a3948;border-radius:8px;padding:9px 11px;outline:0;flex:1;min-width:0}
input:focus{border-color:var(--ac)}
form{display:flex;gap:8px;flex-wrap:wrap}
.red{background:#c0392b}.ok{background:#2e9e5b}
#auth{max-width:340px;margin:12vh auto;padding:24px;background:var(--p);border-radius:14px}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}.logo svg{width:84px;height:84px;filter:drop-shadow(0 6px 14px #2b95e655)}.logo h2{font-size:26px;letter-spacing:1px}
#auth form{flex-direction:column}#auth h2{margin:0 0 10px}
#app{display:grid;grid-template-columns:340px 1fr;height:100dvh}
#side{background:var(--p);display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
#me{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;font-size:15px}#me span{margin-left:auto;color:var(--m)}
#tabs{display:flex}#tabs button{flex:1;border-radius:0;background:none;color:var(--m);border-bottom:2px solid transparent}
#tabs .on{color:var(--ac);border-color:var(--ac)}
#list{flex:1;overflow:auto;padding:6px}
.it{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer}.it:hover,.it.on{background:var(--p2)}
.it button{padding:4px 9px}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.tx{display:flex;flex-direction:column;min-width:0;flex:1}
.tx span{color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ty{color:var(--ac)!important;font-style:normal}
.row{display:flex;gap:8px;padding:6px;align-items:center}.wide{flex:1}.hint{color:var(--m);padding:8px}h3,h4{margin:6px}
#main{min-height:0;position:relative}#empty{height:100%;display:grid;place-items:center;color:var(--m)}
#chat{display:flex;flex-direction:column;height:100%}
#hd{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--p);border-bottom:1px solid var(--line)}
#msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:6px;background:#1a2733}
.m{position:relative;max-width:min(75%,520px);padding:7px 11px;border-radius:14px;background:var(--p2);align-self:flex-start;word-break:break-word}
.m.me{background:var(--mine);align-self:flex-end}
.who{display:block;color:#6ab3f3;font-size:12px}.m time{margin-left:8px;color:#9fb1c3;font-size:11px}
.m u{display:none;position:absolute;top:-6px;right:-4px;cursor:pointer;background:#c0392b;border-radius:50%;width:18px;height:18px;text-align:center;font-size:11px;text-decoration:none;line-height:18px}
.m:hover u{display:block}
.sys{align-self:center;color:#b8c7d6;background:#0006;padding:3px 10px;border-radius:10px;font-size:12px}
.ty2 i{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9fb1c3;animation:b 1s infinite}
.ty2 i:nth-child(2){animation-delay:.2s}.ty2 i:nth-child(3){animation-delay:.4s}@keyframes b{50%{transform:translateY(-4px)}}
#f{padding:10px;background:var(--p);flex-wrap:nowrap}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:60}
#box{background:var(--p);padding:16px;border-radius:14px;width:min(400px,92vw);max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#box form{flex-direction:column}#box form.row{flex-direction:row}
#call{position:fixed;inset:0;background:#000 center/cover;z-index:40}#rv{width:100%;height:100%;object-fit:contain}
#lv{position:absolute;right:12px;top:12px;width:130px;border-radius:10px;background:#222}
#cs{position:absolute;top:16px;left:0;right:150px;text-align:center;font-size:18px}
#cc{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:14px}
#cc button{width:54px;height:54px;border-radius:50%;font-size:20px}
#act.wide{width:min(660px,96vw)}.big{width:100%;height:110px;font-size:24px}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.c4 i{aspect-ratio:1;background:#0b121a;display:grid;place-items:center;border-radius:50%;font-style:normal}.c4 button{padding:4px}
#act{max-height:92vh;overflow:auto;position:fixed;right:14px;top:14px;width:min(440px,94vw);background:var(--p);border-radius:14px;padding:12px;z-index:50;box-shadow:0 8px 30px #000a}
.ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bd button{height:80px;font-size:34px}
.sw{width:60px;height:40px;border-radius:8px;cursor:pointer;display:inline-block;margin:3px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:20px;z-index:99}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.tm{font-size:11px;color:var(--m)}
.bdg{background:var(--ac);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;display:inline-grid;place-items:center;font-size:12px;font-weight:600}.bdg.mu{background:#4a5a6a}
.onl{color:#4cd964!important;font-style:normal}
.ma{display:none;position:absolute;top:-16px;right:8px;background:var(--p);border-radius:10px;padding:2px 4px;gap:2px;z-index:2;box-shadow:0 2px 8px #0008}.m:hover .ma,.m.sel .ma{display:flex}.ma span{cursor:pointer;padding:1px 4px}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.rx b{background:#0004;border-radius:10px;padding:1px 7px;cursor:pointer;font-weight:400;font-size:12px}.rx b.me{outline:1px solid var(--ac)}
.rq{border-left:3px solid var(--ac);padding:1px 8px;margin-bottom:4px;font-size:12px;color:#b8c7d6;background:#0003;border-radius:4px}.m a{color:#8ec9ff}.tk{margin-left:4px;font-size:11px}
#rb{padding:6px 12px;background:var(--p2);font-size:13px;display:flex;justify-content:space-between;color:#b8c7d6}
#ep{display:flex;flex-wrap:wrap;gap:2px;padding:6px;background:var(--p)}#ep button{background:none;font-size:20px;padding:2px 5px}
#nb{padding:8px 12px;background:#1e3a52;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.bk{display:none}
@media(max-width:700px){#app{grid-template-columns:1fr}#main{display:none}body.co #side{display:none}body.co #main{display:block}.bk{display:inline-block}}
</style></head><body>
<div id="auth"><div class="logo"><svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='lg' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#37b6ff'/><stop offset='1' stop-color='#7b4dff'/></linearGradient></defs><path d='M14 4h36a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H32L16 61V50h-2A10 10 0 0 1 4 40V14A10 10 0 0 1 14 4z' fill='url(#lg)'/><path d='M14 4h36a10 10 0 0 1 10 10v6C46 28 22 24 4 18v-4A10 10 0 0 1 14 4z' fill='#fff' fill-opacity='.18'/><text x='32' y='39' font-size='30' font-weight='800' text-anchor='middle' fill='#fff' font-family='Arial,Helvetica,sans-serif'>C</text></svg><h2 id="an">Chatly</h2></div>
 <form id="af"><input id="u" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
 <button class="ok">Log in</button><button type="button" data-do="reg">Register</button></form></div>
<div id="app" hidden>
 <aside id="side"><div id="me" data-do="profile"></div>
  <div id="tabs"><button data-t="chats">Chats</button><button data-t="friends">Friends</button><button data-t="groups">Groups</button></div>
  <div id="nb" hidden>🔔 Get notifications for new messages <button data-do="nreq">Enable</button></div>
  <input id="sq" placeholder="Search chats…" style="margin:6px 8px;flex:none">
  <div id="list"></div></aside>
 <main id="main"><div id="empty">Select a chat to start messaging</div>
  <div id="chat" hidden><div id="hd"></div><div id="msgs"></div><div id="rb" hidden></div><div id="ep" hidden></div>
   <form id="f"><button type="button" data-do="ept">😊</button><input id="in" placeholder="Write a message…" autocomplete="off"><button>➤</button></form></div></main>
</div>
<div id="modal" hidden><div id="box"></div></div>
<div id="call" hidden><video id="rv" autoplay playsinline></video><audio id="ra" autoplay></audio><video id="lv" autoplay playsinline muted></video>
 <div id="cs"></div><div id="cc"><button data-do="cmute">🎤</button><button data-do="ccam">📷</button><button data-do="cscr">🖥</button><button data-do="cbg">🖼</button><button data-do="cend" class="red">📵</button></div></div>
<div id="act" hidden></div><div id="toast" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const APP_NAME='Chatly';document.title=APP_NAME;$('#an').textContent=APP_NAME;
let es,C=null,A=null,Q=Promise.resolve(),lastT=0;
const S={tab:'chats',cur:null,typing:{},d:null,token:localStorage.tok||'',me:localStorage.me||'',modal:null,ring:null,rep:0,edit:0,lastId:0,q:''};
function toast(t){const x=$('#toast');x.textContent=t;x.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>x.hidden=true,3200)}
async function api(a,b={}){try{const r=await fetch('/api',{method:'POST',body:JSON.stringify({a,token:S.token,as:S.me,...b})});const j=await r.json();
  if(j.err==='AUTH'){localStorage.removeItem('tok');location.reload();return{err:1}}
  if(j.err){toast(j.err);return{err:1}}return j}catch{toast('Network error');return{err:1}}}
const av=n=>{let h=0;for(const c of n)h+=c.charCodeAt(0)*7;return`<div class=av style="background:hsl(${h%360},45%,42%)">${esc((n[0]||'?').toUpperCase())}</div>`};
const grp=c=>S.d.groups.find(g=>'g:'+g.id==c);
const other=c=>c.slice(2).split('|').find(x=>x!=S.me);
const nameOf=c=>c[0]=='d'?other(c):(grp(c)||{name:'?'}).name;
const roleOf=(g,u)=>g.owner==u?'owner':g.admins.includes(u)?'admin':'member';
const typers=c=>Object.keys(S.typing).filter(k=>k.startsWith(c+'|')&&Date.now()-S.typing[k]<3500).map(k=>k.slice(c.length+1));
const dmId=u=>'d:'+[S.me,u].sort().join('|');
const focusIn=el=>{const a=document.activeElement;return a&&a.tagName=='INPUT'&&el.contains(a)};

// ---------- auth / connection ----------
async function auth(a){const r=await api(a,{u:$('#u').value,pw:$('#pw').value});if(r.err||!r.token)return;
  S.token=r.token;localStorage.tok=r.token;S.me=r.profiles.includes(localStorage.me)?localStorage.me:r.profiles[0];start()}
function start(){$('#auth').hidden=true;$('#app').hidden=false;localStorage.me=S.me;connect();refresh()}
function connect(){es&&es.close();es=new EventSource('/events?token='+S.token);
  es.onmessage=m=>{const v=JSON.parse(m.data);if(!v.for.includes(S.me))return;
    if(v.e=='sync')refresh();else if(v.e=='typing'){S.typing[v.c+'|'+v.f]=Date.now();drawChat();if(S.tab=='chats'&&!focusIn($('#list')))drawList()}
    else if(v.e=='rd'){if(S.d){S.d.pr[v.c]=Math.max(S.d.pr[v.c]||0,v.id);drawChat()}}else if(v.e=='sig')Q=Q.then(()=>onSig(v)).catch(console.error);else if(v.e=='actv')onAct(v)}}
async function refresh(){const r=await api('sync');if(r.err||!r.me)return;const first=!S.d;S.d=r;
  let mx=0;const fresh=[];for(const c in r.msgs)for(const m of r.msgs[c]){if(m.id>mx)mx=m.id;if(!first&&m.id>S.lastId&&!m.s&&m.f!=S.me)fresh.push({c,m})}
  S.lastId=first?mx:Math.max(S.lastId,mx);fresh.forEach(notify);draw()}
setInterval(()=>{for(const k in S.typing)if(Date.now()-S.typing[k]>4000){delete S.typing[k];if(S.d){drawChat();if(S.tab=='chats'&&!focusIn($('#list')))drawList()}}},1000);

// ---------- unread / notifications / message helpers ----------
const unread=c=>{const rd=S.d.rd[c]||0;return(S.d.msgs[c]||[]).filter(m=>!m.s&&m.f!=S.me&&m.id>rd).length};
const muted=()=>{try{return JSON.parse(localStorage['mu:'+S.me]||'[]')}catch{return[]}},isMuted=c=>muted().includes(c);
const hm=ts=>new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const linkify=t=>t.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target=_blank rel=noopener>$1</a>');
function mh(m,c,g,mod){if(m.s)return`<div class=sys>${esc(m.t)}</div>`;const me=m.f==S.me,q=m.r?(S.d.msgs[c]||[]).find(x=>x.id==m.r):null,pr=S.d.pr[c]||0;
  return`<div class="m ${me?'me':''}"><div class=ma>${['👍','❤️','😂','🔥'].map(e=>`<span data-do=rx data-v="${m.id}|${e}">${e}</span>`).join('')}<span data-do=rep data-v=${m.id}>↩</span>${me?`<span data-do=edt data-v=${m.id}>✏️</span>`:''}${me||mod?`<span data-do=del data-v=${m.id}>🗑</span>`:''}</div>`
   +(g&&!me?`<b class=who>${esc(m.f)}</b>`:'')+(m.r?`<div class=rq>${q?`<b>${esc(q.f)}</b> ${esc(q.t.slice(0,60))}`:'Deleted message'}</div>`:'')
   +linkify(esc(m.t))+`<time>${m.e?'edited · ':''}${hm(m.ts)}</time>`+(me&&c[0]=='d'?`<span class=tk style="color:${m.id<=pr?'#6ab3f3':'#9fb1c3'}">${m.id<=pr?'✓✓':'✓'}</span>`:'')
   +(m.rx?`<div class=rx>${Object.entries(m.rx).map(([e,u])=>`<b class="${u.includes(S.me)?'me':''}" data-do=rx data-v="${m.id}|${e}">${e} ${u.length}</b>`).join('')}</div>`:'')+`</div>`}
function markRead(){if(!S.cur||document.hidden||!S.d)return;const m=S.d.msgs[S.cur]||[],last=m.length?m[m.length-1].id:0;
  if(last>(S.d.rd[S.cur]||0)){S.d.rd[S.cur]=last;api('read',{c:S.cur,id:last})}}
function updTitle(){const n=Object.keys(S.d.msgs).reduce((a,c)=>a+(isMuted(c)?0:unread(c)),0);document.title=(n?'('+n+') ':'')+APP_NAME}
let AC;const beep=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.06;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.12)}catch{}};
function notify({c,m}){if(isMuted(c)||(S.cur==c&&!document.hidden))return;beep();const t=c[0]=='g'?nameOf(c)+' · '+m.f:m.f;
  if(document.hidden&&window.Notification&&Notification.permission=='granted'){try{const n=new Notification(t,{body:m.t.slice(0,120),tag:c});n.onclick=()=>{focus();DO.open(c);n.close()}}catch{}}
  else toast('💬 '+t+': '+m.t.slice(0,60))}
function rbar(){const r=$('#rb'),id=S.edit||S.rep,m=(S.d&&S.cur?S.d.msgs[S.cur]||[]:[]).find(x=>x.id==id);r.hidden=!id;if(!id)return;
  r.innerHTML=`<span>${S.edit?'✏️ Editing message':'↩ Reply to '+esc(m?m.f:'')+': '+esc(m?m.t.slice(0,50):'')}</span><span data-do=rcl style="cursor:pointer">✕</span>`}
$('#ep').innerHTML=['😀','😂','😍','🥰','😎','🤔','😢','😡','👍','👎','🙏','👏','🔥','❤️','💯','🎉','😴','🤝','😅','🙌','💪','👀','✅','❌'].map(e=>`<button type=button data-do=emo data-v=${e}>${e}</button>`).join('');
$('#sq').addEventListener('input',e=>{S.q=e.target.value.toLowerCase();drawList()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.d)draw()});addEventListener('focus',()=>{if(S.d)draw()});

// ---------- drawing ----------
function draw(){if(!S.d)return;
  $('#me').innerHTML=`${av(S.me)}<b>${esc(S.me)}</b><span>⇄</span>`;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==S.tab));
  drawChat();markRead();if(!focusIn($('#list')))drawList();updTitle();
  $('#nb').hidden=!(window.Notification&&Notification.permission=='default');$('#sq').hidden=S.tab!='chats';
  if(S.modal&&!$('#modal').hidden&&!focusIn($('#box')))S.modal()}
function chats(){const d=S.d;return[...d.friends.f.map(f=>dmId(f)),...d.groups.map(g=>'g:'+g.id)]
  .map(c=>{const m=d.msgs[c]||[];return{c,last:m[m.length-1]}}).sort((x,y)=>(y.last?.ts||0)-(x.last?.ts||0)).filter(({c})=>!S.q||nameOf(c).toLowerCase().includes(S.q))}
function drawList(){const d=S.d,f=d.friends;let h='';
  if(S.tab=='chats')h=chats().map(({c,last})=>{const ty=typers(c),n=unread(c),mu=isMuted(c);
    return`<div class="it ${c==S.cur?'on':''}" data-do=open data-v="${esc(c)}">${av(nameOf(c))}<div class=tx><b>${esc(nameOf(c))}</b><span>${ty.length?'<i class=ty>typing…</i>':last?esc((last.s?'':last.f==S.me?'You: ':c[0]=='g'?last.f+': ':'')+last.t):'No messages yet'}</span></div><div class=rt><span class=tm>${last?hm(last.ts):''}</span><span>${mu?'🔕 ':''}${n?`<span class="bdg ${mu?'mu':''}">${n>9?'9+':n}</span>`:''}</span></div></div>`}).join('')||'<p class=hint>No chats yet. Add friends or join a group.</p>';
  else if(S.tab=='friends')h=`<form id=fa class=row><input id=fu placeholder="Add friend by username"><button>Add</button></form>`
    +(f.i.length?'<h4>Requests</h4>':'')+f.i.map(u=>`<div class=it>${av(u)}<div class=tx><b>${esc(u)}</b><span>wants to be friends</span></div><button class=ok data-do=facc data-v=${u}>✓</button><button data-do=fdec data-v=${u}>✕</button></div>`).join('')
    +(f.o.length?'<h4>Sent</h4>':'')+f.o.map(u=>`<div class=it>${av(u)}<div class=tx><b>${esc(u)}</b><span>pending</span></div><button data-do=fdec data-v=${u}>Cancel</button></div>`).join('')
    +'<h4>Friends</h4>'+(f.f.map(u=>`<div class=it data-do=open data-v="${dmId(u)}">${av(u)}<div class=tx><b>${esc(u)}</b><span>${S.d.on.includes(u)?'<i class=onl>online</i>':''}</span></div><button data-do=frem data-v=${u}>✕</button></div>`).join('')||'<p class=hint>No friends yet.</p>');
  else h=`<div class=row><button class=wide data-do=gnew>＋ New group</button></div><form id=jc class=row><input id=jcode placeholder="Invite code"><button>Join</button></form><h4>My groups</h4>`
    +(d.groups.map(g=>`<div class=it data-do=open data-v="g:${g.id}">${av(g.name)}<div class=tx><b>${esc(g.name)}</b><span>${g.members.length} members · ${roleOf(g,S.me)}</span></div></div>`).join('')||'<p class=hint>None yet.</p>')
    +'<h4>Public groups</h4>'+(d.pub.map(g=>`<div class=it>${av(g.name)}<div class=tx><b>${esc(g.name)}</b><span>${g.n} members</span></div><button class=ok data-do=gjoin data-v=${g.id}>Join</button></div>`).join('')||'<p class=hint>No public groups.</p>');
  $('#list').innerHTML=h}
function drawChat(){if(!S.d)return;
  const ok=S.cur&&(S.cur[0]=='d'?S.d.friends.f.includes(other(S.cur)):grp(S.cur));if(!ok)S.cur=null;

const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const sig=(to,d)=>api('sig',{to,d});
async function media(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video})}catch{toast('Camera/microphone unavailable (needs HTTPS and permission)');return null}}
function showCall(t){applyCbg();$('#call').hidden=false;$('#cs').textContent=t;$('#lv').srcObject=C.st}
async function startCall(video){if(C||S.cur?.[0]!='d')return;const peer=other(S.cur),st=await media(video);if(!st)return;
  C={peer,st,pc:null,ready:false};showCall('Calling '+peer+'…');sig(peer,{t:'ring',video})}
async function acceptCall(){const r=S.ring;S.ring=null;closeModal();if(!r||C)return;const st=await media(r.video);
  if(!st){sig(r.pr,{t:'rej'});return}C={peer:r.pr,st,pc:null,ready:false};mkpc();showCall('Connecting…');sig(r.pr,{t:'accept'})}
function mkpc(){const pc=new RTCPeerConnection(ICE);C.pc=pc;
  pc.onicecandidate=x=>x.candidate&&C&&sig(C.peer,{t:'ice',c:x.candidate});
  pc.ontrack=x=>{if(x.track.kind=='video')$('#rv').srcObject=new MediaStream([x.track]);else $('#ra').srcObject=new MediaStream([x.track]);$('#cs').textContent=C?C.peer+' · connected':''};
  pc.onnegotiationneeded=async()=>{if(!C||!C.ready)return;await pc.setLocalDescription(await pc.createOffer());sig(C.peer,{t:'offer',s:pc.localDescription})};
  pc.onconnectionstatechange=()=>{if(C&&pc.connectionState=='failed')endCall(true)}}
async function onSig(v){const d=v.d,pr=v.f;
  if(d.t=='ring'){if(C||S.ring){sig(pr,{t:'busy'});return}
    S.ring={pr,video:d.video};show(()=>{$('#box').innerHTML=`<h3>${esc(pr)} is calling…</h3><p>${d.video?'Video':'Audio'} call</p><div class=row><button class=ok data-do=cacc>Accept</button><button class=red data-do=crej>Decline</button></div>`})}
  else if(d.t=='accept'&&C&&C.peer==pr&&!C.pc){mkpc();C.ready=true;C.st.getTracks().forEach(t=>C.pc.addTrack(t,C.st));C.added=true}
  else if(d.t=='offer'&&C&&C.peer==pr){await C.pc.setRemoteDescription(d.s);
    if(!C.added){C.st.getTracks().forEach(t=>C.pc.addTrack(t,C.st));C.added=true}
    await C.pc.setLocalDescription(await C.pc.createAnswer());sig(pr,{t:'answer',s:C.pc.localDescription});C.ready=true}
  else if(d.t=='answer'&&C&&C.pc)await C.pc.setRemoteDescription(d.s);
  else if(d.t=='ice'&&C&&C.pc){try{await C.pc.addIceCandidate(d.c)}catch{}}
  else if(d.t=='end'){if(S.ring&&S.ring.pr==pr){S.ring=null;closeModal()}if(C&&C.peer==pr)endCall(false)}
  else if(d.t=='busy'||d.t=='rej'){if(C&&C.peer==pr){toast(pr+(d.t=='busy'?' is busy':' declined the call'));endCall(false)}}}
function endCall(send){if(!C)return;if(send)sig(C.peer,{t:'end'});
  C.st.getTracks().forEach(t=>t.stop());C.scr&&C.scr.getTracks().forEach(t=>t.stop());C.pc&&C.pc.close();C=null;
  $('#call').hidden=true;$('#rv').srcObject=null;$('#lv').srcObject=null;$('#ra').srcObject=null}
async function screenShare(){if(!C||!C.pc)return toast('Start a call first');
  if(C.scr)return stopScr();if(!navigator.mediaDevices.getDisplayMedia)return toast('Screen sharing is not supported on this device');
  let s;try{s=await navigator.mediaDevices.getDisplayMedia({video:true})}catch{return}
  const tr=s.getVideoTracks()[0];C.scr=s;const snd=C.pc.getSenders().find(x=>x.track&&x.track.kind=='video');
  if(snd)await snd.replaceTrack(tr);else C.ss=C.pc.addTrack(tr,s);
  $('#lv').srcObject=s;tr.onended=stopScr}
async function stopScr(){if(!C||!C.scr)return;const s=C.scr;C.scr=null;s.getTracks().forEach(t=>t.stop());
  if(C.ss){try{C.pc.removeTrack(C.ss)}catch{}C.ss=null}
  else{const snd=C.pc.getSenders().find(x=>x.track&&x.track.kind=='video'),cam=C.st.getVideoTracks()[0];if(snd&&cam)await snd.replaceTrack(cam)}
  $('#lv').srcObject=C.st}

const BLK=[[250,140,100,20],[90,270,120,20],[390,250,120,20],[290,280,20,70],[120,100,20,80],[460,100,20,80]];

function tick(g){if(g!==A){clearInterval(g.iv);return}const s=g.st;if(s.w)return;
  s.p.forEach((p,i)=>{if(p.hp<=0){if(--p.dd<=0){p.hp=3;[p.x,p.y]=SP[i]}return}
    const nx=p.x+p.dx*8,ny=p.y+p.dy*8;if(!hitB(nx,p.y,12)&&nx>12&&nx<588)p.x=nx;if(!hitB(p.x,ny,12)&&ny>12&&ny<388)p.y=ny;
    p.cd--;if(p.f&&p.cd<=0){p.cd=4;s.b.push({x:p.x,y:p.y,vx:Math.round(Math.cos(p.a)*16),vy:Math.round(Math.sin(p.a)*16),o:p.n,l:30})}});
  s.b=s.b.filter(b=>{b.x+=b.vx;b.y+=b.vy;if(--b.l<=0||b.x<0||b.x>600||b.y<0||b.y>400||hitB(b.x,b.y,2))return false;
    for(const p of s.p)if(p.n!=b.o&&p.hp>0&&Math.hypot(p.x-b.x,p.y-b.y)<14){p.hp--;
      if(p.hp<=0){p.dd=25;const k=s.p.find(q=>q.n==b.o);k.k++;if(k.k>=5)s.w=k.n}return false}return true});
  bc()}
function drawS(g){const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d'),s=g.st,C=['#e74c3c','#3498db','#2ecc71','#f1c40f'];

function setupCv(){const cv=$('#cv');if(!cv)return;
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();KS.mx=(e.clientX-r.left)*600/r.width;KS.my=(e.clientY-r.top)*400/r.height;if(Date.now()-KS.t>100){KS.t=Date.now();sendM()}};
  cv.onmousedown=()=>{KS.m=1;sendM()};cv.onmouseup=cv.onmouseleave=()=>{KS.m=0;sendM()}}

const G={
 ttt:{n:'Tic-Tac-Toe',e:'❌',min:2,max:2,init:()=>({b:Array(9).fill(''),t:0}),
  reduce(A,w,i){const s=A.st;if(A.P[s.t]!=w||s.b[i]||winL(s.b))return false;s.b[i]='XO'[s.t];s.t=1-s.t},
  view(A){const s=A.st,w=winL(s.b);return`<p>${w?(w=='draw'?'Draw!':esc(A.P['XO'.indexOf(w)])+' wins! 🎉'):esc(A.P[s.t])+"'s turn ("+'XO'[s.t]+')'}</p><div class=bd>${s.b.map((c,i)=>gb(i,c||'·')).join('')}</div>`}},
 c4:{n:'Connect Four',e:'🔴',min:2,max:2,init:()=>({b:Array(42).fill(0),t:0,w:''}),
  reduce(A,w,i){const s=A.st;if(A.P[s.t]!=w||s.w)return false;const c=+i;
   for(let r=5;r>=0;r--)if(!s.b[r*7+c]){s.b[r*7+c]=s.t+1;if(four(s.b,r,c))s.w=A.P[s.t];else if(s.b.every(x=>x))s.w='draw';s.t=1-s.t;return}return false},
  view(A){const s=A.st;let h=`<p>${s.w?(s.w=='draw'?'Draw!':esc(s.w)+' wins! 🎉'):esc(A.P[s.t])+"'s turn "+['🔴','🟡'][s.t]}</p><div class=c4>`;
   for(let c=0;c<7;c++)h+=gb(c,'⬇');for(let i=0;i<42;i++)h+=`<i>${['','🔴','🟡'][s.b[i]]}</i>`;return h+'</div>'}},
 rps:{n:'Rock Paper Scissors',e:'✂️',min:2,max:2,init:P=>({m:{},sc:zero(P),last:''}),
  reduce(A,w,i){const s=A.st;if(!'rps'.includes(i)||s.m[w])return false;s.m[w]=i;
   if(A.P.every(p=>s.m[p])){const[a,c]=A.P,d=('rps'.indexOf(s.m[a])-'rps'.indexOf(s.m[c])+3)%3;
    s.last=E[s.m[a]]+' vs '+E[s.m[c]]+(d==0?' · draw':' · '+(d==1?a:c)+' wins');if(d==1)s.sc[a]++;if(d==2)s.sc[c]++;s.m={}}},
  view(A,me){const s=A.st;return`<p>${scr(A)}</p><p>${esc(s.last)||'Pick one!'}</p>`+(s.m[me]?'<p class=hint>Waiting for the other player…</p>':`<div class=row>${gb('r','🪨')}${gb('p','📄')}${gb('s','✂️')}</div>`)}},
 mem:{n:'Memory Match',e:'🧠',min:2,max:4,
  init:P=>{const e=['🐶','🐱','🦊','🐸','🐵','🦁','🐼','🐙'];return{c:[...e,...e].sort(()=>Math.random()-.5),o:[],d:[],t:0,sc:zero(P)}},
  reduce(A,w,i){const s=A.st;i=+i;if(A.P[s.t]!=w||s.o.length>1||s.o.includes(i)||s.d.includes(i))return false;s.o.push(i);
   if(s.o.length==2){const[a,c]=s.o;if(s.c[a]==s.c[c]){s.d.push(a,c);s.sc[w]++;s.o=[]}else setTimeout(()=>{s.o=[];s.t=(s.t+1)%A.P.length;bc()},1000)}},
  view(A){const s=A.st;return`<p>${scr(A)}</p><p>${s.d.length==16?'Game over!':esc(A.P[s.t])+"'s turn"}</p><div class=bd style="grid-template-columns:repeat(4,1fr)">${s.c.map((c,i)=>gb(i,s.o.includes(i)||s.d.includes(i)?c:'❓','style="height:64px;font-size:28px"')).join('')}</div>`}},
 math:{n:'Quick Math',e:'➗',min:2,max:6,init:P=>({...mq(),sc:zero(P),w:''}),
  reduce(A,w,i){const s=A.st;if(s.w||+i!=s.a)return false;s.sc[w]++;if(s.sc[w]>=5)s.w=w;else Object.assign(s,mq())},
  view(A){const s=A.st;return`<p>${scr(A)} · first to 5</p><h2>${s.w?esc(s.w)+' wins! 🎉':s.q+' = ?'}</h2>`+(s.w?'':`<form id=gf class=row><input id=gv inputmode=numeric autocomplete=off><button>OK</button></form>`)}},
 react:{n:'Reaction Duel',e:'⚡',min:2,max:6,init:()=>({p:'idle',out:[],w:'',ms:0}),
  reduce(A,w,i){const s=A.st;
   if(i=='go'){if(w!=A.P[0]||s.p=='wait'||s.p=='go')return false;s.p='wait';s.out=[];s.w='';setTimeout(()=>{if(s.p=='wait'){s.p='go';s.t0=Date.now();bc()}},2000+rnd(3500));return}
   if(i!='tap')return false;
   if(s.p=='wait'){if(s.out.includes(w))return false;s.out.push(w);if(s.out.length>=A.P.length)s.p='idle'}
   else if(s.p=='go'&&!s.out.includes(w)){s.w=w;s.ms=Date.now()-s.t0;s.p='done'}else return false},
  view(A,me){const s=A.st;return`<p>${s.p=='done'?esc(s.w)+' was first! ('+s.ms+' ms)':s.p=='wait'?'Wait for green… tapping early = out'+(s.out.length?' · out: '+esc(s.out.join(', ')):''):s.p=='go'?'':'Ready?'}</p>`
   +(s.p=='wait'?gb('tap','✋ WAIT…','class="big red"'):s.p=='go'?gb('tap','TAP NOW!','class="big ok"'):'')
   +(s.p=='idle'||s.p=='done'?(A.P[0]==me?gb('go','Start round'):'<p class=hint>Host starts the round</p>'):'')}},
 tap:{n:'Tap Race (10s)',e:'👆',min:2,max:8,init:P=>({n:zero(P),on:false,done:false}),
  reduce(A,w,i){const s=A.st;
   if(i=='go'){if(w!=A.P[0]||s.on)return false;s.n=zero(A.P);s.on=true;s.done=false;setTimeout(()=>{s.on=false;s.done=true;bc()},10000);return}
   if(i=='tap'&&s.on)s.n[w]++;else return false},
  view(A,me){const s=A.st,top=Math.max(...A.P.map(p=>s.n[p]));return`<p>${scr(A)}</p>`+(s.on?gb('tap','👆 TAP!','class=big'):s.done?`<h3>${esc(A.P.filter(p=>s.n[p]==top).join(' & '))} won with ${top}!</h3>`:'')+(!s.on&&A.P[0]==me?gb('go','Start 10s race'):'')}},
 guess:{n:'Guess the Number',e:'🔢',min:2,max:6,init:()=>({s:1+rnd(100),log:[],w:''}),
  reduce(A,w,i){const s=A.st,g=+i;if(s.w||!(g>=1&&g<=100))return false;s.log.unshift(w+': '+g+(g==s.s?' ✅':g<s.s?' ↑ higher':' ↓ lower'));s.log=s.log.slice(0,8);if(g==s.s)s.w=w},
  view(A){const s=A.st;return`<p>I'm thinking of a number 1–100</p>`+(s.w?`<h3>${esc(s.w)} got it: ${s.s}! 🎉</h3>`:`<form id=gf class=row><input id=gv inputmode=numeric autocomplete=off><button>Guess</button></form>`)+s.log.map(l=>`<div class=hint>${esc(l)}</div>`).join('')}},
 pig:{n:'Pig (dice)',e:'🎲',min:2,max:6,init:P=>({t:0,cur:0,sc:zero(P),d:0,w:''}),
  reduce(A,w,i){const s=A.st;if(s.w||A.P[s.t]!=w)return false;
   if(i=='roll'){s.d=1+rnd(6);if(s.d==1){s.cur=0;s.t=(s.t+1)%A.P.length}else s.cur+=s.d}
   else if(i=='hold'){s.sc[w]+=s.cur;s.cur=0;if(s.sc[w]>=50)s.w=w;else s.t=(s.t+1)%A.P.length}else return false},
  view(A){const s=A.st;return`<p>${scr(A)}</p>`+(s.w?`<h3>${esc(s.w)} wins! 🎉</h3>`:`<p>${esc(A.P[s.t])}'s turn · turn total <b>${s.cur}</b> · last roll ${s.d||'–'}</p><div class=row>${gb('roll','🎲 Roll')}${gb('hold','✋ Hold')}</div><p class=hint>First to 50. Rolling a 1 loses the turn total.</p>`)}},
 hl:{n:'Higher or Lower',e:'🃏',min:1,max:6,init:P=>({c:1+rnd(13),t:0,sc:zero(P),msg:'',w:''}),
  reduce(A,w,i){const s=A.st;if(s.w||A.P[s.t]!=w||!'hl'.includes(i))return false;const n=1+rnd(13),ok=n==s.c?null:(n>s.c)==(i=='h');
   s.msg=`${w}: ${s.c} → ${n} ${ok===null?'tie':ok?'✅ +1':'❌'}`;if(ok){s.sc[w]++;if(s.sc[w]>=5)s.w=w}s.c=n;s.t=(s.t+1)%A.P.length},
  view(A){const s=A.st;return`<p>${scr(A)}</p><h2>🃏 ${s.c}</h2>`+(s.w?`<h3>${esc(s.w)} wins! 🎉</h3>`:`<p>${esc(A.P[s.t])}'s turn: will the next card be…</p><div class=row>${gb('h','⬆ Higher')}${gb('l','⬇ Lower')}</div>`)+`<p class=hint>${esc(s.msg)} · first to 5</p>`}},
 shoot:{n:'Arena Shooter (PC)',e:'🔫',min:2,max:4,
  init:P=>({p:P.map((n,i)=>({n,x:SP[i][0],y:SP[i][1],hp:3,k:0,dx:0,dy:0,a:0,f:0,cd:0,dd:0})),b:[],w:''}),
  start(g){clearInterval(g.iv);g.iv=setInterval(()=>tick(g),80)},
  reduce(A,w,i){const p=A.st.p.find(x=>x.n==w),[,dx,dy,a,f]=i.split(':');if(p){p.dx=+dx;p.dy=+dy;p.a=+a;p.f=+f}return false},
  view(){return`<canvas id=cv width=600 height=400 style="width:100%;border-radius:8px;cursor:crosshair"></canvas><p class=hint>WASD / arrows to move · aim with mouse · click or Space to shoot · first to 5 kills</p>`},
  draw:drawS},
 yt:{n:'YouTube Together',e:'▶',min:1,max:99,init:()=>({}),reduce:()=>false,
  view:()=>`<form id=yf class=row><input id=yu placeholder="Paste a YouTube link"><button>Load</button></form><div id=yp></div>`}};

function openGame(k){if(!S.cur)return;A={k,c:S.cur,hn:S.me,host:true,P:[S.me],ph:'lobby',st:null};aSend({t:'open',k});drawGame()}
function bc(){if(!A)return;aSend({t:'st',P:A.P,ph:A.ph,st:A.st});drawGame()}
function feed(w,i){if(!A||A.ph!='play'||!A.P.includes(w))return;if(G[A.k].reduce(A,w,String(i))!==false)bc()}
function input(i){if(!A||A.ph!='play')return;A.host?feed(S.me,i):aSend({t:'in',i})}
function closeGame(send){if(!A)return;if(send&&A.host)aSend({t:'close'});clearInterval(A.iv);try{A.pl&&A.pl.destroy()}catch{}A=null;const el=$('#act');el.hidden=true;el.innerHTML=''}
function drawGame(){if(!A)return;const g=G[A.k],el=$('#act'),me=S.me;el.hidden=false;el.classList.toggle('wide',A.k=='shoot');
  if(A.ph=='play'&&g.draw&&el.querySelector('canvas')){g.draw(A);return}
  let h=`<div class=ah><b>${g.e} ${g.n}</b><span>${A.host&&A.ph=='play'?'<button data-do=ga>↻</button> ':''}<button data-do=gx>✕</button></span></div>`;
  if(A.ph=='lobby')h+=`<p>Host: ${esc(A.hn)}</p><p>Players (${A.P.length}/${g.max>50?'∞':g.max}): ${esc(A.P.join(', '))||'—'}</p>`
    +(A.P.includes(me)?'':`<button class=ok data-do=gj>Join</button> `)
    +(A.host?(A.P.length>=g.min?`<button class=ok data-do=gs>Start</button>`:`<p class=hint>Need at least ${g.min} players</p>`):'<p class=hint>Waiting for the host to start…</p>');
  else h+=(A.P.includes(me)?'':'<p class=hint>Spectating</p>')+g.view(A,me);
  el.innerHTML=h;if(A.ph=='play'&&g.draw){setupCv();g.draw(A)}}
function onAct(v){const d=v.d,pr=v.f;
  if(d.t=='open'){if(!G[d.k])return;if(A)closeGame(false);A={k:d.k,c:v.c,hn:pr,host:false,P:[],ph:'lobby',st:null};drawGame();toast(pr+' started '+G[d.k].n);return}
  if(!A||A.c!=v.c)return;
  if(d.t=='close'&&pr==A.hn)return closeGame(false);
  if(A.host){if(d.t=='join'&&A.ph=='lobby'&&!A.P.includes(pr)&&A.P.length<G[A.k].max){A.P.push(pr);bc()}else if(d.t=='in')feed(pr,d.i)}
  else if(d.t=='st'&&pr==A.hn){A.P=d.P;A.ph=d.ph;A.st=d.st;drawGame()}
  if(d.t=='yt'&&A.k=='yt')ytRemote(d)}
const ytAPI=()=>new Promise(r=>{if(window.YT&&YT.Player)return r();window.onYouTubeIframeAPIReady=r;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)});
async function ytLoad(id,remote){await ytAPI();if(!A||A.k!='yt')return;if(remote){A.quiet=true;setTimeout(()=>A&&(A.quiet=false),2000)}
  if(A.pl&&A.pl.loadVideoById)A.pl.loadVideoById(id);else if(!A.pl)A.pl=new YT.Player('yp',{width:'100%',height:240,videoId:id,playerVars:{playsinline:1},events:{onStateChange:ytState}})}
function ytState(x){if(!A||A.quiet)return;if(x.data==1)aSend({t:'yt',a:'play',ts:A.pl.getCurrentTime()});else if(x.data==2)aSend({t:'yt',a:'pause',ts:A.pl.getCurrentTime()})}
function ytRemote(d){if(d.a=='load')return ytLoad(d.id,true);if(A.pl&&A.pl.seekTo){A.quiet=true;A.pl.seekTo(d.ts,true);d.a=='play'?A.pl.playVideo():A.pl.pauseVideo();setTimeout(()=>A&&(A.quiet=false),800)}}

if(S.token&&S.me)start();
</script></body></html>
